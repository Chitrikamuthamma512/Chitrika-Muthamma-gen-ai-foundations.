<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Interview Coach</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .app { width: 100%; max-width: 680px; }
    .header { margin-bottom: 1.5rem; }
    .header h1 { font-size: 20px; font-weight: 500; }
    .header p  { font-size: 14px; color: #666; margin-top: 4px; }

    .card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }

    .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    label { font-size: 13px; color: #555; display: block; margin-bottom: 6px; }

    select, input[type="text"] {
      width: 100%; font-size: 14px; padding: 8px 10px;
      border: 1px solid #ddd; border-radius: 8px;
      background: #fff; color: #1a1a1a; outline: none;
    }
    select:focus, input[type="text"]:focus { border-color: #534AB7; }

    button {
      cursor: pointer; font-family: inherit; font-size: 14px;
      border-radius: 8px; border: 1px solid #ccc;
      background: #fff; color: #1a1a1a; padding: 10px 16px;
      transition: background 0.15s;
    }
    button:hover     { background: #f0f0f0; }
    button:disabled  { opacity: 0.5; cursor: not-allowed; }

    .start-btn { width: 100%; margin-top: 1rem; font-size: 15px; }

    #interviewArea { display: none; }

    .progress-bar {
      height: 4px; background: #e8e8e8; border-radius: 2px;
      margin-bottom: 1.25rem; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: #534AB7; border-radius: 2px;
      transition: width 0.4s ease; width: 0%;
    }

    .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
    .q-badge { font-size: 12px; padding: 3px 10px; border-radius: 8px; background: #f0f0f0; color: #555; border: 1px solid #e0e0e0; }
    .q-num   { font-size: 13px; color: #777; }
    .question-text { font-size: 16px; font-weight: 500; line-height: 1.6; }

    textarea {
      width: 100%; min-height: 120px; font-size: 14px; line-height: 1.6;
      padding: 12px; border: 1px solid #ddd; border-radius: 8px;
      background: #fff; color: #1a1a1a; resize: vertical;
      font-family: inherit; outline: none;
    }
    textarea:focus { border-color: #534AB7; }

    .action-row { display: flex; gap: 10px; margin-top: 1rem; }
    .btn-primary { flex: 1; }
    .btn-skip    { flex: 0; padding: 10px 18px; }

    .feedback-card { display: none; }
    .feedback-title { font-size: 13px; font-weight: 500; color: #555; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .score-pill { font-size: 12px; padding: 2px 10px; border-radius: 20px; font-weight: 500; }
    .score-high { background: #EAF3DE; color: #3B6D11; }
    .score-mid  { background: #FAEEDA; color: #854F0B; }
    .score-low  { background: #FCEBEB; color: #A32D2D; }
    .feedback-text { font-size: 14px; line-height: 1.7; }
    .tip-section { margin-top: 10px; padding-top: 10px; border-top: 1px solid #eee; }
    .tip-label   { font-size: 12px; color: #777; margin-bottom: 6px; }
    .tip-text    { font-size: 13px; line-height: 1.6; }

    #summaryCard { display: none; }
    .summary-score { font-size: 36px; font-weight: 500; text-align: center; margin-bottom: 4px; }
    .summary-label { font-size: 14px; color: #777; text-align: center; margin-bottom: 1.25rem; }
    .summary-grid  { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1.25rem; }
    .stat-card     { background: #f5f5f5; border-radius: 8px; padding: 12px; text-align: center; }
    .stat-num      { font-size: 20px; font-weight: 500; }
    .stat-lbl      { font-size: 12px; color: #777; margin-top: 2px; }

    .error-msg { color: #A32D2D; font-size: 13px; margin-top: 8px; }

    .loading-dots { display: inline-flex; gap: 4px; }
    .loading-dots span { width: 6px; height: 6px; border-radius: 50%; background: #999; animation: blink 1.2s infinite; }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }

    @media (max-width: 480px) {
      .setup-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="app">

  <div class="header">
    <h1><i class="ti ti-briefcase" style="font-size:18px; margin-right:8px; vertical-align:-2px;"></i>AI Interview Coach</h1>
    <p>Practice interviews with personalized AI feedback on each answer.</p>
  </div>

  <!-- SETUP -->
  <div id="setupArea">
    <div class="card">
      <div class="setup-grid">
        <div>
          <label for="roleInput">Job role</label>
          <input type="text" id="roleInput" placeholder="e.g. AI Engineer, Data Scientist" value="Software Developer" />
        </div>
        <div>
          <label for="levelSelect">Experience level</label>
          <select id="levelSelect">
            <option value="fresher">Fresher / Entry level</option>
            <option value="junior">Junior (1–3 yrs)</option>
            <option value="mid">Mid-level (3–6 yrs)</option>
            <option value="senior">Senior (6+ yrs)</option>
          </select>
        </div>
        <div>
          <label for="typeSelect">Interview type</label>
          <select id="typeSelect">
            <option value="HR">HR / Behavioral</option>
            <option value="Technical">Technical</option>
            <option value="Mixed" selected>Mixed</option>
          </select>
        </div>
        <div>
          <label for="countSelect">Number of questions</label>
          <select id="countSelect">
            <option value="3">3 questions</option>
            <option value="5" selected>5 questions</option>
            <option value="8">8 questions</option>
          </select>
        </div>
      </div>
      <button class="start-btn" onclick="startInterview()">
        <i class="ti ti-player-play" style="font-size:14px; margin-right:6px;"></i>Start Interview
      </button>
      <div id="setupError" class="error-msg"></div>
    </div>
  </div>

  <!-- INTERVIEW -->
  <div id="interviewArea">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="q-meta">
      <span class="q-badge" id="qBadge">HR</span>
      <span class="q-num"  id="qNum">Question 1 of 5</span>
    </div>
    <div class="card">
      <div class="question-text" id="questionText">Loading...</div>
    </div>
    <textarea id="answerInput" placeholder="Type your answer here... Aim for 2–4 sentences using specific examples where possible."></textarea>
    <div class="action-row">
      <button class="btn-primary" id="submitBtn" onclick="submitAnswer()">
        <i class="ti ti-check" style="font-size:14px; margin-right:6px;"></i>Submit Answer
      </button>
      <button class="btn-skip" id="skipBtn" onclick="skipQuestion()">Skip</button>
    </div>

    <div class="card feedback-card" id="feedbackCard">
      <div class="feedback-title">
        <i class="ti ti-messages" style="font-size:15px;"></i> Feedback
        <span class="score-pill" id="scorePill"></span>
      </div>
      <div class="feedback-text" id="feedbackText"></div>
      <div class="tip-section">
        <div class="tip-label"><i class="ti ti-bulb" style="font-size:13px; margin-right:4px;"></i>Improvement tip</div>
        <div class="tip-text" id="tipText"></div>
      </div>
      <div class="action-row" style="margin-top:12px;">
        <button class="btn-primary" onclick="nextQuestion()">
          <i class="ti ti-arrow-right" style="font-size:14px; margin-right:6px;"></i>Next Question
        </button>
      </div>
    </div>
  </div>

  <!-- SUMMARY -->
  <div class="card" id="summaryCard">
    <div class="summary-score" id="summaryScore">–</div>
    <div class="summary-label">Overall interview score</div>
    <div class="summary-grid">
      <div class="stat-card"><div class="stat-num" id="statAnswered">0</div><div class="stat-lbl">Answered</div></div>
      <div class="stat-card"><div class="stat-num" id="statSkipped">0</div><div class="stat-lbl">Skipped</div></div>
      <div class="stat-card"><div class="stat-num" id="statAvg">–</div><div class="stat-lbl">Avg score</div></div>
    </div>
    <button style="width:100%; padding:10px;" onclick="restartInterview()">
      <i class="ti ti-refresh" style="font-size:14px; margin-right:6px;"></i>Start new interview
    </button>
  </div>

</div>
<script>
  // ── Change this if your Flask server runs on a different host/port ──
  const API_BASE = "http://localhost:5000";

  let questions = [], currentQ = 0, scores = [], skipped = 0, config = {};

  async function startInterview() {
    config = {
      role:  document.getElementById('roleInput').value || 'Software Developer',
      level: document.getElementById('levelSelect').value,
      type:  document.getElementById('typeSelect').value,
      count: parseInt(document.getElementById('countSelect').value)
    };
    document.getElementById('setupError').textContent = '';
    document.getElementById('setupArea').style.display    = 'none';
    document.getElementById('interviewArea').style.display = 'block';
    document.getElementById('questionText').innerHTML =
      '<span style="color:#888;">Generating questions <span class="loading-dots"><span></span><span></span><span></span></span></span>';

    try {
      const res  = await fetch(`${API_BASE}/generate-questions`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(config)
      });
      const data = await res.json();
      questions  = data.questions;
      currentQ   = 0;
      showQuestion();
    } catch(e) {
      document.getElementById('interviewArea').style.display = 'none';
      document.getElementById('setupArea').style.display     = 'block';
      document.getElementById('setupError').textContent      = 'Could not connect to server. Is Flask running?';
    }
  }

  function showQuestion() {
    if (currentQ >= questions.length) { showSummary(); return; }
    const q   = questions[currentQ];
    const pct = Math.round((currentQ / questions.length) * 100);
    document.getElementById('progressFill').style.width    = pct + '%';
    document.getElementById('qBadge').textContent          = q.type;
    document.getElementById('qNum').textContent            = `Question ${currentQ + 1} of ${questions.length}`;
    document.getElementById('questionText').textContent    = q.q;
    document.getElementById('answerInput').value           = '';
    document.getElementById('feedbackCard').style.display  = 'none';
    document.getElementById('answerInput').style.display   = 'block';
    document.getElementById('submitBtn').style.display     = 'block';
    document.getElementById('skipBtn').style.display       = 'block';
    document.getElementById('submitBtn').disabled = false;
    document.getElementById('skipBtn').disabled   = false;
  }

  async function submitAnswer() {
    const answer = document.getElementById('answerInput').value.trim();
    if (!answer) { document.getElementById('answerInput').focus(); return; }

    document.getElementById('submitBtn').disabled = true;
    document.getElementById('skipBtn').disabled   = true;

    const fc = document.getElementById('feedbackCard');
    fc.style.display = 'block';
    document.getElementById('feedbackText').innerHTML =
      '<span style="color:#888;">Analyzing your answer <span class="loading-dots"><span></span><span></span><span></span></span></span>';
    document.getElementById('tipText').textContent   = '';
    document.getElementById('scorePill').textContent = '';
    document.getElementById('scorePill').className   = 'score-pill';

    try {
      const res    = await fetch(`${API_BASE}/evaluate-answer`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          role: config.role, level: config.level,
          question: questions[currentQ].q, answer
        })
      });
      const result = await res.json();
      scores.push(result.score);

      document.getElementById('feedbackText').textContent = result.feedback;
      document.getElementById('tipText').textContent      = result.tip;

      const pill = document.getElementById('scorePill');
      pill.textContent = result.score + '/10';
      pill.className   = 'score-pill ' +
        (result.score >= 7 ? 'score-high' : result.score >= 5 ? 'score-mid' : 'score-low');

      document.getElementById('answerInput').style.display = 'none';
      document.getElementById('submitBtn').style.display   = 'none';
      document.getElementById('skipBtn').style.display     = 'none';
    } catch(e) {
      document.getElementById('feedbackText').textContent = 'Error getting feedback. Is Flask running?';
    }
  }

  function skipQuestion()  { skipped++; currentQ++; showQuestion(); }
  function nextQuestion()  { currentQ++; showQuestion(); }

  function showSummary() {
    document.getElementById('interviewArea').style.display = 'none';
    document.getElementById('summaryCard').style.display   = 'block';
    const avg = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : 0;
    document.getElementById('summaryScore').textContent  = avg ? Math.round(avg*10)+'%' : '–';
    document.getElementById('statAnswered').textContent  = scores.length;
    document.getElementById('statSkipped').textContent   = skipped;
    document.getElementById('statAvg').textContent       = avg ? avg+'/10' : '–';
  }

  function restartInterview() {
    questions=[]; currentQ=0; scores=[]; skipped=0; config={};
    document.getElementById('summaryCard').style.display   = 'none';
    document.getElementById('setupArea').style.display     = 'block';
    document.getElementById('progressFill').style.width    = '0%';
  }
</script>
</body>
</html>
